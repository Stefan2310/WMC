<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Über mich</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>Über mich</h1>
        <nav>
            <a href="#hobbys">Hobbys</a>
        </nav>
    </header>

    <main class="site-main">
        <article class="karte">
            <h2>Wer bin ich?</h2>
            <p>Hallo! Ich bin Stefan und lerne hier Webprogrammierung.</p>
            <div class="image-wrapper">
                <img src="profilbild.jpg" alt="Ein Platzhalter-Bild von Stefan">
            </div>
        </article>

        <!-- Kontaktformular-Sektion -->
        <article class="karte">
            <h2>Kontaktformular</h2>
            <form action="mailto:deine-email@example.com?subject=Nachricht%20von%20meiner%20Webseite" method="post" enctype="text/plain">
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-Mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="plz">Postleitzahl (4 Ziffern):</label>
                    <input type="text" id="plz" name="plz" pattern="[0-9]{4}" title="Bitte genau 4 Ziffern eingeben">
                </div>

                <div class="form-group">
                    <p class="radio-label">Wie hast du mich gefunden?</p>
                    <div class="radio-options">
                        <div>
                            <input type="radio" id="suche" name="quelle" value="suche" checked>
                            <label for="suche">Suchmaschine</label>
                        </div>
                        <div>
                            <input type="radio" id="freunde" name="quelle" value="freunde">
                            <label for="freunde">Freunde</label>
                        </div>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter" value="ja">
                    <label for="newsletter">Newsletter abonnieren</label>
                </div>

                <div class="form-group">
                    <label for="bewertung">Wie gefällt dir die Seite?</label>
                    <select id="bewertung" name="bewertung">
                        <option value="super">Super</option>
                        <option value="gut">Gut</option>
                        <option value="verbesserungspotenzial">Ausbaufähig</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="interessen">Interessen (Mehrfachwahl):</label>
                    <select id="interessen" name="interessen" multiple>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="gaming">Gaming</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nachricht">Nachricht:</label>
                    <textarea id="nachricht" name="nachricht" rows="4" required></textarea>
                </div>

                <button type="submit">Abschicken</button>
            </form>
        </article>

        <aside id="hobbys" class="karte">
            <h3>Meine Hobbys</h3>
            <ul>
                <li>Programmieren</li>
                <li>Video Spiele</li>
            </ul>
        </aside>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Stefan</p>
    </footer>

</body>
</html>
